name: rag2
channels:
  - nvidia
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - numpy<2.0 # Pinning this to avoid the Windows conflicts
  - pandas
  - chromadb
  - matplotlib
#  - pytorch-cuda = 12.1
  - scikit-learn
  - sentence-transformers
  - langchain-core
  - langchain-text-splitters
  - streamlit
  - ipykernel
  - ipywidgets
  - pip
  - pypdf
  - langchain
  - plotly
  - pip:
      - torch --index-url https://download.pytorch.org/whl/cu121

